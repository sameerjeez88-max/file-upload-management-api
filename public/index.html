<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager — Multer Upload Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-lg">FM</div>
        <span class="text-lg font-bold tracking-wider">File Management Suite</span>
      </div>
      <div class="text-xs text-slate-400">
        Engineered by <span class="text-indigo-400 font-medium">Rana Yasir Mahy Ud Din</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Secure File Storage & Uploads</h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">Upload, manage, preview, and delete server files instantly via Multer REST APIs.</p>
    </div>

    <!-- Upload Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-10 max-w-xl mx-auto">
      <form id="upload-form" class="space-y-4">
        <div class="border-2 border-dashed border-slate-700 hover:border-indigo-500 transition-all rounded-xl p-6 text-center cursor-pointer">
          <input type="file" id="file-input" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/20">
          Upload File to Server
        </button>
      </form>
      <div id="upload-msg" class="mt-3 text-xs text-center hidden"></div>
    </div>

    <!-- Files Gallery -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-bold mb-4 border-b border-slate-800 pb-3">Uploaded Files Directory</h2>
      <div id="files-list" class="space-y-3">
        <!-- Populated dynamically -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • File Upload & Management REST API
  </footer>

  <script>
    async function fetchFiles() {
      try {
        const res = await fetch('/api/files');
        const json = await res.json();
        if (json.success) {
          renderFiles(json.data);
        }
      } catch (err) {
        console.error('Error fetching files:', err);
      }
    }

    function renderFiles(files) {
      const list = document.getElementById('files-list');
      if (files.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No files uploaded yet.</p>`;
        return;
      }

      list.innerHTML = files.map(f => `
        <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
          <div class="overflow-hidden pr-4">
            <h4 class="font-bold text-sm truncate">${f.originalName}</h4>
            <div class="flex items-center space-x-3 text-xs text-slate-400 mt-1">
              <span>Size: ${f.size}</span>
              <span>•</span>
              <span>Uploaded: ${f.uploadDate}</span>
            </div>
          </div>
          <div class="flex items-center space-x-2 flex-shrink-0">
            <a href="/uploads/${f.filename}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-all">Download</a>
            <button onclick="deleteFile(${f.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-1.5 rounded-lg font-medium transition-all">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      const msg = document.getElementById('upload-msg');
      
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      msg.classList.remove('hidden', 'text-red-400', 'text-emerald-400');
      msg.innerText = 'Uploading file...';
      msg.classList.add('text-indigo-400');

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();

        if (json.success) {
          msg.innerText = '✅ File uploaded successfully!';
          msg.classList.remove('text-indigo-400');
          msg.classList.add('text-emerald-400');
          fileInput.value = '';
          fetchFiles();
        } else {
          msg.innerText = '❌ ' + json.message;
          msg.classList.remove('text-indigo-400');
          msg.classList.add('text-red-400');
        }
      } catch (err) {
        msg.innerText = '❌ Failed to upload file.';
        msg.classList.remove('text-indigo-400');
        msg.classList.add('text-red-400');
      }
    });

    async function deleteFile(id) {
      if (!confirm('Are you sure you want to delete this file?')) return;
      try {
        const res = await fetch(`/api/files/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          fetchFiles();
        } else {
          alert(json.message);
        }
      } catch (err) {
        alert('Failed to delete file.');
      }
    }

    fetchFiles();
  </script>
</body>
</html>
